name: DCO Check

on:
  pull_request:
    branches: [main]

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      # Default pull_request checkout is the merge commit, so with full depth
      # both base.sha and head.sha are present - including for fork PRs.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Inline rather than a third-party action: the previous one
      # (christophebedard/dco-require-action) was deleted upstream, and every PR
      # failed with "repository not found" until someone looked at the log.
      - name: Check DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author_email=$(git show -s --format='%ae' "$sha")
            author_name=$(git show -s --format='%an' "$sha")
            subject=$(git show -s --format='%s' "$sha")
            expected="Signed-off-by: ${author_name} <${author_email}>"
            if git show -s --format='%B' "$sha" | grep -qiFx "$expected"; then
              echo "ok       ${sha:0:8} ${subject}"
            else
              echo "MISSING  ${sha:0:8} ${subject}"
              echo "         expected a trailer: ${expected}"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "$missing commit(s) are missing a Developer Certificate of Origin sign-off."
            echo "Add one to new commits with 'git commit -s', or sign off the"
            echo "existing ones with: git rebase --signoff $BASE_SHA"
            exit 1
          fi
          echo ""
          echo "All commits carry a matching DCO sign-off."
